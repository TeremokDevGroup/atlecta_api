services:
  nginx:
    image: jonasal/nginx-certbot:5.4.1-nginx1.27.4
    ports:
      - 80:80
      - 443:443
    configs:
      - source: nginx_config
        # target: /etc/nginx/nginx.conf
        target: /etc/nginx/user_conf.d/myapp.conf
    env_file:
      - nginx-certbot.env
    volumes:
      - nginx_secrets:/etc/letsencrypt
    networks:
      - public
    depends_on:
      - atlecta_api
      - minio

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - private
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 60s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server --console-address ":9001" /data/
    ports:
      - "9001:9001"
      - "9000:9000"
    environment:
      # MINIO_SERVER_URL: "${HOST_ADDRESS}"
      # MINIO_BROWSER_REDIRECT_URL: "${HOST_ADDRESS}/minio/"
      MINIO_ROOT_USER: ${S3_ACCESS}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes:
      - minio-storage:/data
    networks:
      - public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"] # Enable AOF persistence
    restart: always
    networks:
      - private

  atlecta_api:
    image: atlecta_api:latest
    build: .
    depends_on:
      - postgres
      - minio
      - redis
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - private
      - public
      # - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 2
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml

  atlecta_frontend:
    build:
      context: ../atlecta_frontend_2.0/atlecta_frontend/
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5173:5173" # Expose frontend on port 5173
    depends_on:
      - atlecta_api
    networks:
      - public

volumes:
  postgres-data:
  minio-storage:
  redis-data:
  nginx_secrets:

configs:
  nginx_config:
    file: ${NGINX_CONF_PATH}

networks:
  public:
  private:
    internal: true
