# Run poetry pytest on pull requests and push to main

# NOTE: If you don't specify `branches: [main]`, then this actions runs twice on pull requests
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: ikalnytskyi/action-setup-postgres@v6
        with:
          username: atlecta_user
          password: password
          database: atlecta_test_db
          port: 5432
          postgres-version: "16"
        id: postgres

      - uses: actions/setup-python@v2
        with:
          python-version: 3.12.2

      - name: cache poetry install
        uses: actions/cache@v2
        with:
          path: ~/.local
          key: poetry-1.8.3-0

      - uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: cache deps
        id: cache-deps
        uses: actions/cache@v2
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/poetry.lock') }}

      - run: poetry install --no-interaction --no-root
        if: steps.cache-deps.outputs.cache-hit != 'true'

      - run: poetry install --no-interaction

      - run: poetry run pytest

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Stop containers and networks
        run: docker-compose down
      - name: Start docker-compose
        run: docker compose up -d
      - name: Clear dungling images
        run: docker system prune -f
