# user nginx;
# worker_processes auto;

error_log /var/log/nginx/error.log notice;
# pid /var/run/nginx.pid;


# events {
#     worker_connections 1024;
# }


http {
    upstream atlecta_api {
        server atlecta_api:8080;
    }

    upstream minio_api {
        server minio:9000;
    }

    upstream minio_console {
        server minio:9001;
    }

    map $http_x_api_key $valid_api_key {
        default "no";
        c160649f-8e66-47b2-beba-92ee8c454a4a "yes"; # Replace with your actual API key
    }

    server {
        listen 80;
        server_name api.atlecta.ru;

        location / {

            if ($valid_api_key = "no") {
                return 403 "Forbidden: Invalid API Key";
            }

            return 301 https://$host$request_uri; # Redirect to https
        }
    }

    server {
        listen 443 ssl default_server reuseport;
        listen [::]:443 ssl default_server reuseport;

        server_name api.atlecta.ru;

        ssl_certificate /etc/letsencrypt/live/api.atlecta.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.atlecta.ru/privkey.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.atlecta.ru/chain.pem;

        ssl_dhparam /etc/letsencrypt/live/dhparams/dhparam.pem;

        location / {

            if ($valid_api_key = "no") {
                return 403 "Forbidden: Invalid API Key";
            }

            proxy_pass http://atlecta_api;

            sendfile on;
            client_max_body_size 20M;
            client_body_buffer_size 20M;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }


    server {
        listen 9000;
        proxy_buffering off;
        ignore_invalid_headers off;
        client_max_body_size 0; # allow any size to be uploaded

        resolver 127.0.0.11 valid=10s;
        resolver_timeout 5s;

        location /minio/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            proxy_pass http://minio_api/;
        }
        location /minio/ui/ {
            rewrite ^/minio/ui/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # This is necessary to pass the correct IP to be hashed
            real_ip_header X-Real-IP;

            proxy_connect_timeout 300;

            # To support websockets in MinIO versions released after January 2023
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Some environments may encounter CORS errors (Kubernetes + Nginx Ingress)
            # Uncomment the following line to set the Origin request to an empty string
            proxy_set_header Origin '';

            chunked_transfer_encoding off;

            proxy_pass http://minio_console/;

            allow 193.218.138.76;
            allow 85.140.161.102;
            allow 85.140.162.87;
            allow 195.211.167.114;
            allow 84.22.141.114;
            allow 85.140.160.234;
            allow 193.218.138.72;
            deny all;
        }
    }
}

