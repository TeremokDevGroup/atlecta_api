user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    upstream atlecta_api {
        # api name from compose file
        server atlecta_api:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://atlecta_api;
        }
    }
}
