[project]
name = "atlecta-api"
version = "0.1.0"
description = ""
authors = [{ name = "David Lashevich", email = "david.lashevich@gmail.com" }]
requires-python = ">=3.13.2,<4"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.4,<0.116",
  "alembic>=1.13.1,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn>=0.29.0,<0.30",
  "asyncpg>=0.30.0",
  "python-dotenv>=1.0.1,<2",
  "fastapi-users-db-sqlalchemy>=6.0.1,<7",
  "aiofiles>=23.2.1,<24",
  "pytest>=8.2.1,<9",
  "httpx>=0.27.0,<0.28",
  "pytest-asyncio>=0.23.7,<0.24",
  "aioboto3>=13.2.0,<14",
  "redis>=5.2.1,<6",
  "python-multipart>=0.0.20,<0.0.21",
  "faker>=36.1.1,<37",
  "fastapi-pagination>=0.12.34,<0.13",
  "sqlakeyset>=2.0.1739066250,<3",
  "httpx-oauth>=0.16.1",
  "geoalchemy2>=0.17.1",
  "gunicorn>=23.0.0",
  "websockets>=15.0.1",
  "fastapi-filter>=2.0.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src",
  "/home/zawarudo/.pyenv/shims/python",
  "/usr/bin/python",
]
asyncio_mode = "auto"
