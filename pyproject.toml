[tool.poetry]
name = "atlecta-api"
version = "0.1.0"
description = ""
authors = ["David Lashevich <david.lashevich@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12.2"
fastapi = { extras = ["standart"], version = "^0.115.4" }
alembic = "^1.13.1"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
uvicorn = "^0.29.0"
asyncpg = "^0.29.0"
python-dotenv = "^1.0.1"
fastapi-users-db-sqlalchemy = "^6.0.1"
aiofiles = "^23.2.1"
pytest = "^8.2.1"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.7"
aioboto3 = "^13.2.0"
redis = "^5.2.1"
python-multipart = "^0.0.20"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src",
  "/home/zawarudo/.pyenv/shims/python",
  "/usr/bin/python",
]
asyncio_mode = "auto"
